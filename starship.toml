# Starship Configuration
# Docs: https://starship.rs/config/

# Modern, fast, and informative prompt for AI agents and CLI work

format = """
[╭─](bold green)$username\
$hostname\
$localip\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$package\
$nodejs\
$python\
$ruby\
$rust\
$golang\
$terraform\
$docker_context\
$kubernetes\
$aws\
$gcloud\
$cmd_duration
[╰─](bold green)$character"""

# Prompt character
[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"
vimcmd_symbol = "[←](bold green)"

# Username
[username]
style_user = "green bold"
style_root = "red bold"
format = "[$user]($style) "
disabled = false
show_always = false

# Hostname
[hostname]
ssh_only = true
format = "on [$hostname](bold yellow) "
disabled = false

# Directory
[directory]
truncation_length = 3
truncate_to_repo = true
format = "in [$path]($style)[$read_only]($read_only_style) "
style = "bold bright-red" # DIRECTORY_COLOR
read_only = " 🔒"
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

# Git Branch
[git_branch]
symbol = " "
format = "on [$symbol$branch(:$remote_branch)]($style) "
style = "bold bright-red" # GIT_BRANCH_COLOR
truncation_length = 30
truncation_symbol = "…"

# Git Commit
[git_commit]
commit_hash_length = 7
format = "[\\($hash$tag\\)]($style) "
style = "bold green"
only_detached = true
tag_symbol = " 🏷  "
tag_disabled = false

# Git State
[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bold yellow"

# Git Metrics
[git_metrics]
disabled = false
added_style = "bold green"
deleted_style = "bold red"
format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'

# Git Status
[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold red"
conflicted = "⚔️ "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "📦"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# Package Version
[package]
format = "via [$symbol$version]($style) "
symbol = "📦 "
style = "208 bold"
display_private = false
disabled = false

# Node.js
[nodejs]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold green"
disabled = false

# Python
[python]
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
symbol = " "
style = "bold yellow"
pyenv_version_name = false
pyenv_prefix = "pyenv "
python_binary = ["python3", "python"]
disabled = false

# Ruby
[ruby]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold red"
disabled = false

# Rust
[rust]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold red"
disabled = false

# Go
[golang]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold cyan"
disabled = false

# Terraform
[terraform]
format = "via [$symbol$workspace]($style) "
symbol = "💠 "
style = "bold 105"
disabled = false

# Docker Context
[docker_context]
format = "via [$symbol$context]($style) "
symbol = " "
style = "bold blue"
only_with_files = true
disabled = false

# Kubernetes
[kubernetes]
format = 'on [$symbol$context( \($namespace\))]($style) '
symbol = "☸ "
style = "bold blue"
disabled = true

# AWS
[aws]
format = 'on [$symbol($profile )(\($region\) )]($style)'
symbol = "☁️  "
style = "bold yellow"
disabled = false

# GCloud
[gcloud]
format = 'on [$symbol$account(@$domain)(\($region\))]($style) '
symbol = "☁️  "
style = "bold blue"
disabled = false

# Command Duration
[cmd_duration]
min_time = 500
format = "took [$duration]($style) "
style = "bold yellow"
show_milliseconds = false
show_notifications = false

# Time
[time]
disabled = true
format = "[$time]($style) "
style = "bold white"
use_12hr = false
time_format = "%T"

# Line Break
[line_break]
disabled = false

# Jobs
[jobs]
symbol = "✦"
style = "bold blue"
number_threshold = 1
symbol_threshold = 1
format = "[$symbol$number]($style) "

# Status
[status]
disabled = false
format = '[\[$symbol$status_common_meaning$status_signal_name$status_maybe_int\]]($style) '
symbol = "✖"
style = "bold red"
map_symbol = true
